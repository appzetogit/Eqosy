# Nginx site for eqosy.com  ->  /etc/nginx/sites-available/eqosy.conf
# (symlink into sites-enabled/; this VPS only loads sites-enabled/*.conf)
#
# Needs these two lines inside the http { } block of /etc/nginx/nginx.conf:
#     limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=20r/s;
#     limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    server_name eqosy.com www.eqosy.com;
    root /var/www/eqosy;
    index index.html;

    client_max_body_size 6M;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Frontend (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Images stored on the VPS (Backend UPLOAD_STORAGE_ROOT)
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # Health / readiness
    location ~ ^/(health|ready)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (port 5000)
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn perip 30;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    # Socket.IO server (port 5001)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/eqosy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eqosy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name eqosy.com www.eqosy.com;
    return 301 https://$host$request_uri;
}
